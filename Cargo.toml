[package]
name = "hyprosk"
version = "0.1.0"
edition = "2024"
authors = ["Ziggs25"]
description = "Fast, lightweight, native Wayland On-Screen Keyboard designed for Hyprland with automatic input-field detection"
license = "MIT OR Apache-2.0"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
xkbcommon = { version = "0.8", features = ["wayland"] }
calloop = "0.13"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
nix = { version = "0.29", features = ["signal", "socket", "user", "mman", "fs"] }
libc = "0.2"
# Slint = paint bucket only: headless software renderer, no windowing.
slint = { version = "=1.14.0", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
i-slint-core = { version = "=1.14.0", features = ["std", "svg"] }

[build-dependencies]
slint-build = "=1.14.0"

[dev-dependencies]
png = "0.17"

[[example]]
name = "preview"
path = "examples/preview.rs"

[[example]]
name = "preview_portrait"
path = "examples/preview_portrait.rs"

[[example]]
name = "preview_phone"
path = "examples/preview_phone.rs"

[[example]]
name = "preview_poco"
path = "examples/preview_poco.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
